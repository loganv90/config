# get help in tmux: man tmux
# source the tmux config file: <prefix> + : + source-file {path_to_file}
# list all keybinds: <prefix> + : + list-keys
# swap the current window with the window at the given number: <prefix> + : + swap-window -t {window_number}
# show a setting: <prefix> + : + show -g history-limit
# set a setting: <prefix> + : + set -g mouse off
# resize panes equally at tree level: <prefix> + : + select-layout -E
# cycle through layout presets: <prefix> + <space>

set-window-option -g mode-keys vi
set-option -g focus-events on
set-option -a terminal-features 'alacritty:RGB'

set -s escape-time 0
set -g history-limit 20000

bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R

bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

bind s choose-tree -Zs -O name

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe

